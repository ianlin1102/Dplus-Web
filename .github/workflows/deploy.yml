name: Deploy to CloudBase Static Hosting

# 触发条件
on:
  push:
    branches:
      - main  # main 分支有新提交时触发
  workflow_dispatch:  # 允许手动触发

# 环境变量（可选）
env:
  NODE_VERSION: '20'  # Node.js 版本

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
    # 1. 检出代码
    - name: 📦 Checkout code
      uses: actions/checkout@v4

    # 2. 设置 Node.js 环境
    - name: 🔧 Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ env.NODE_VERSION }}
        cache: 'npm'  # 启用 npm 缓存，加速构建

    # 3. 安装依赖
    - name: 📥 Install dependencies
      run: npm ci  # npm ci 比 npm install 更适合 CI 环境

    # 4. 构建项目
    - name: 🏗️ Build project
      run: npm run build

    # 5. 验证构建产物
    - name: ✅ Verify build output
      run: |
        echo "检查构建产物..."
        ls -lah dist/
        echo "构建产物文件列表："
        find dist/ -type f

    # 6. 安装 CloudBase CLI
    - name: 📦 Install CloudBase CLI
      run: npm install -g @cloudbase/cli

    # 7. 登录 CloudBase
    - name: 🔐 Login to CloudBase
      run: |
        tcb login --apiKeyId ${{ secrets.TCB_SECRET_ID }} --apiKey ${{ secrets.TCB_SECRET_KEY }}
        echo "✅ CloudBase 登录成功"

    # 8. 部署到静态托管
    - name: 🚀 Deploy to CloudBase Static Hosting
      run: |
        echo "开始部署到云开发静态托管..."
        tcb hosting deploy ./dist / -e ${{ secrets.TCB_ENV_ID }}
        echo "✅ 部署完成"

    # 9. 部署成功通知
    - name: 🎉 Deployment Summary
      if: success()
      run: |
        echo "================================"
        echo "✅ 部署成功！"
        echo "环境 ID: ${{ secrets.TCB_ENV_ID }}"
        echo "部署时间: $(date '+%Y-%m-%d %H:%M:%S')"
        echo "访问地址: https://cloud1-6gnd02he13c1ff2e-1380655578.tcloudbaseapp.com/"
        echo "================================"

    # 10. 部署失败通知
    - name: ❌ Deployment Failed
      if: failure()
      run: |
        echo "================================"
        echo "❌ 部署失败，请检查日志"
        echo "================================"
