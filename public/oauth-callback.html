<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>OAuth Callback</title>
  <style>
    body {
      background: #0a0a0f;
      color: #fff;
      font-family: system-ui, -apple-system, sans-serif;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
    }
    .loading {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      border: 3px solid rgba(6, 182, 212, 0.2);
      border-top-color: #06b6d4;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>
  <div class="loading">
    <div class="spinner"></div>
    <p>Processing...</p>
  </div>
  <script>
    // Handle both Authorization Code flow (query params) and Implicit flow (fragment)
    // Using BroadcastChannel to avoid COOP (Cross-Origin-Opener-Policy) issues

    // Check for implicit flow (id_token in fragment)
    const hash = window.location.hash.substring(1); // Remove the leading #
    if (hash && hash.includes('id_token=')) {
      // Parse the fragment
      const params = new URLSearchParams(hash);
      const idToken = params.get('id_token');
      const error = params.get('error');

      const message = {
        type: 'google-auth',
        id_token: idToken,
        error: error
      };

      // Use BroadcastChannel API (works even when COOP blocks window.opener)
      try {
        const channel = new BroadcastChannel('oauth-channel');
        channel.postMessage(message);
        channel.close();
        // Close this popup window
        window.close();
      } catch (e) {
        // Fallback: try window.opener.postMessage (may be blocked by COOP)
        if (window.opener) {
          try {
            window.opener.postMessage(message, window.location.origin);
            window.close();
          } catch (e2) {
            // If still blocked, redirect to app
            window.location.replace('/auth/google/callback?id_token=' + encodeURIComponent(idToken));
          }
        } else {
          // No opener, redirect to app with token in state
          window.location.replace('/auth/google/callback?id_token=' + encodeURIComponent(idToken));
        }
      }
    } else {
      // Authorization Code flow - redirect with query params
      const queryString = window.location.search;
      window.location.replace('/auth/google/callback' + queryString);
    }
  </script>
</body>
</html>
