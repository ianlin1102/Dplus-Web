<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>卡项购买 API 测试</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: system-ui, -apple-system, sans-serif;
      background: #1f2937;
      color: #e5e7eb;
      padding: 20px;
      min-height: 100vh;
    }
    .container {
      max-width: 900px;
      margin: 0 auto;
    }
    h1 {
      margin-bottom: 20px;
      color: #fff;
    }
    .info-box {
      background: #374151;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
    }
    .info-box h3 {
      margin-bottom: 10px;
      color: #fff;
    }
    .info-box ul {
      padding-left: 20px;
      color: #9ca3af;
    }
    pre {
      background: #111827;
      padding: 10px;
      border-radius: 4px;
      overflow: auto;
      font-size: 13px;
      color: #9ca3af;
    }
    .buttons {
      margin-bottom: 20px;
      display: flex;
      gap: 10px;
    }
    button {
      padding: 10px 20px;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-size: 14px;
      font-weight: 500;
    }
    .btn-primary {
      background: #3b82f6;
      color: white;
    }
    .btn-primary:disabled {
      background: #9ca3af;
      cursor: not-allowed;
    }
    .btn-secondary {
      background: #6b7280;
      color: white;
    }
    .results {
      background: #374151;
      padding: 15px;
      border-radius: 8px;
      margin-bottom: 20px;
      display: none;
    }
    .results.show {
      display: block;
    }
    .results h3 {
      margin-bottom: 10px;
    }
    .result-item {
      display: flex;
      justify-content: space-between;
      padding: 5px 0;
      border-bottom: 1px solid #4b5563;
    }
    .result-item:last-child {
      border-bottom: none;
    }
    .pass {
      color: #22c55e;
      font-weight: bold;
    }
    .fail {
      color: #ef4444;
      font-weight: bold;
    }
    .warn {
      color: #f59e0b;
    }
    .log-container {
      background: #111827;
      border-radius: 8px;
      padding: 15px;
      min-height: 300px;
      max-height: 500px;
      overflow: auto;
    }
    .log-container h3 {
      margin-bottom: 10px;
      color: #fff;
    }
    .log-entry {
      font-family: monospace;
      font-size: 13px;
      line-height: 1.6;
    }
    .log-time {
      color: #6b7280;
    }
    .log-success {
      color: #22c55e;
      font-weight: bold;
    }
    .log-error {
      color: #ef4444;
      font-weight: bold;
    }
    .log-info {
      color: #6b7280;
    }
    .log-warn {
      color: #f59e0b;
    }
    .log-detail {
      margin-left: 80px;
      color: #9ca3af;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .success-box {
      background: #065f46;
      border: 1px solid #10b981;
    }
    .warning-box {
      background: #78350f;
      border: 1px solid #f59e0b;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>卡项购买 API 测试</h1>

    <div class="info-box">
      <h3>测试说明</h3>
      <ul>
        <li>测试 cardService.js 中的 createPurchaseOrder 函数</li>
        <li>检查数据库连接是否正常</li>
        <li>验证购买记录是否能正确保存到 ax_purchase_history 集合</li>
      </ul>

      <h3 style="margin-top: 15px;">测试数据</h3>
      <pre id="testData"></pre>
    </div>

    <div class="buttons">
      <button id="runBtn" class="btn-primary" onclick="runTests()">运行测试</button>
      <button class="btn-secondary" onclick="clearLogs()">清空日志</button>
    </div>

    <div id="results" class="results">
      <h3>测试结果汇总</h3>
      <div id="resultItems"></div>
    </div>

    <div class="log-container">
      <h3>测试日志</h3>
      <div id="logs">
        <div style="color: #6b7280; font-style: italic;">点击 "运行测试" 开始测试...</div>
      </div>
    </div>
  </div>

  <!-- CloudBase SDK -->
  <script src="https://imgcache.qq.com/qcloud/cloudbase-js-sdk/2.7.0/cloudbase.full.js"></script>

  <script>
    // 测试数据
    const TEST_DATA = {
      cardId: 'test_card_001',
      paymentMethod: 'zelle',
      cardInfo: {
        CARD_TITLE: '测试卡项',
        CARD_PRICE: 100,
        CARD_TYPE: 1
      }
    };

    // CloudBase 配置
    const ENV_ID = 'cloud1-6gnd02he13c1ff2e';

    let app = null;
    let db = null;
    let isRunning = false;

    // 显示测试数据
    document.getElementById('testData').textContent = JSON.stringify(TEST_DATA, null, 2);

    // 生成购买识别码
    function generatePurchaseId() {
      const now = new Date();
      const dateStr = now.getFullYear().toString() +
        String(now.getMonth() + 1).padStart(2, '0') +
        String(now.getDate()).padStart(2, '0') +
        String(now.getHours()).padStart(2, '0') +
        String(now.getMinutes()).padStart(2, '0') +
        String(now.getSeconds()).padStart(2, '0');
      const random = Math.floor(Math.random() * 10000).toString().padStart(4, '0');
      return `PUR${dateStr}${random}`;
    }

    // 添加日志
    function addLog(type, message, detail = '') {
      const logsDiv = document.getElementById('logs');
      const time = new Date().toLocaleTimeString();

      const prefix = {
        success: '[PASS]',
        error: '[FAIL]',
        warn: '[WARN]',
        info: '[INFO]'
      }[type] || '[INFO]';

      const colorClass = {
        success: 'log-success',
        error: 'log-error',
        warn: 'log-warn',
        info: 'log-info'
      }[type] || 'log-info';

      let html = `<div class="log-entry">
        <span class="log-time">[${time}]</span>
        <span class="${colorClass}"> ${prefix} </span>
        <span>${message}</span>
      </div>`;

      if (detail) {
        html += `<div class="log-detail">${detail}</div>`;
      }

      logsDiv.innerHTML += html;
      logsDiv.scrollTop = logsDiv.scrollHeight;
    }

    // 清空日志
    function clearLogs() {
      document.getElementById('logs').innerHTML = '<div style="color: #6b7280; font-style: italic;">点击 "运行测试" 开始测试...</div>';
      document.getElementById('results').classList.remove('show');
    }

    // 显示测试结果
    function showResults(results) {
      const resultsDiv = document.getElementById('results');
      const itemsDiv = document.getElementById('resultItems');

      const items = [
        { name: '1. CloudBase 初始化', key: 'init' },
        { name: '2. 匿名登录', key: 'login' },
        { name: '3. 数据库连接', key: 'dbConnection' },
        { name: '4. 创建购买订单', key: 'createOrder' },
        { name: '5. 验证购买记录', key: 'verifyRecord' },
        { name: '6. 清理测试数据', key: 'cleanup' }
      ];

      let html = '';
      items.forEach(item => {
        const status = results[item.key];
        const statusText = status === true ? 'PASS' : (status === false ? 'FAIL' : 'SKIP');
        const statusClass = status === true ? 'pass' : (status === false ? 'fail' : 'warn');
        html += `<div class="result-item">
          <span>${item.name}</span>
          <span class="${statusClass}">${statusText}</span>
        </div>`;
      });

      itemsDiv.innerHTML = html;

      const passCount = Object.values(results).filter(v => v === true).length;
      if (passCount >= 5) {
        resultsDiv.className = 'results show success-box';
      } else {
        resultsDiv.className = 'results show warning-box';
      }
    }

    // 测试 1: 初始化 CloudBase
    async function testInit() {
      addLog('info', '测试 1: CloudBase SDK 初始化...');
      try {
        app = cloudbase.init({
          env: ENV_ID
        });
        addLog('success', 'CloudBase SDK 初始化成功', `环境 ID: ${ENV_ID}`);
        return true;
      } catch (error) {
        addLog('error', 'CloudBase SDK 初始化失败', error.message);
        return false;
      }
    }

    // 测试 2: 匿名登录
    async function testLogin() {
      addLog('info', '测试 2: 匿名登录...');
      try {
        const auth = app.auth({ persistence: 'local' });

        let loginState = await auth.getLoginState();
        if (loginState) {
          addLog('success', '已有登录状态', `用户 ID: ${loginState.user?.uid || 'N/A'}`);
          return true;
        }

        // 尝试匿名登录
        if (auth.signInAnonymously) {
          await auth.signInAnonymously();
        } else if (auth.anonymousAuthProvider) {
          await auth.anonymousAuthProvider().signIn();
        }

        loginState = await auth.getLoginState();
        if (loginState) {
          addLog('success', '匿名登录成功', `用户 ID: ${loginState.user?.uid || 'N/A'}`);
          return true;
        }

        addLog('warn', '匿名登录后无法获取登录状态');
        return true; // 仍然继续
      } catch (error) {
        addLog('warn', '匿名登录失败 (可能继续运行)', error.message);
        return true; // 即使失败也继续
      }
    }

    // 测试 3: 数据库连接
    async function testDbConnection() {
      addLog('info', '测试 3: 数据库连接...');
      try {
        db = app.database();

        const result = await db.collection('ax_card_item').limit(1).get();
        addLog('success', '数据库连接正常', `查询 ax_card_item 返回 ${result.data?.length || 0} 条记录`);
        return true;
      } catch (error) {
        addLog('error', '数据库连接失败', error.message);
        return false;
      }
    }

    // 测试 4: 创建购买订单
    async function testCreateOrder() {
      addLog('info', '测试 4: 创建购买订单 (createPurchaseOrder)...');
      addLog('info', '测试数据:', JSON.stringify(TEST_DATA, null, 2));

      try {
        const purchaseId = generatePurchaseId();
        const now = Date.now();

        const purchaseRecord = {
          PURCHASE_ID: purchaseId,
          PURCHASE_CARD_ID: TEST_DATA.cardId,
          PURCHASE_CARD_TITLE: TEST_DATA.cardInfo.CARD_TITLE || '',
          PURCHASE_CARD_PRICE: TEST_DATA.cardInfo.CARD_PRICE || 0,
          PURCHASE_CARD_TYPE: TEST_DATA.cardInfo.CARD_TYPE || 0,
          PURCHASE_USER_ID: 'test_user_' + Date.now(),
          PURCHASE_USER_NAME: '测试用户',
          PURCHASE_USER_PHONE: '1234567890',
          PURCHASE_PAYMENT_METHOD: TEST_DATA.paymentMethod,
          PURCHASE_STATUS: 0,
          PURCHASE_PROOF_URL: '',
          PURCHASE_ADD_TIME: now,
          PURCHASE_UPDATE_TIME: now,
          PURCHASE_CONFIRM_TIME: 0,
          PURCHASE_REMARK: '测试订单 - 可删除',
        };

        addLog('info', '正在保存到 ax_purchase_history 集合...');

        const result = await db.collection('ax_purchase_history').add(purchaseRecord);

        addLog('success', '购买订单创建成功!', `购买识别码: ${purchaseId}\n记录 ID: ${result.id}`);

        return { success: true, purchaseId, recordId: result.id };
      } catch (error) {
        addLog('error', '创建购买订单失败', error.message + '\n' + JSON.stringify(error, null, 2));
        return { success: false };
      }
    }

    // 测试 5: 验证购买记录
    async function testVerifyRecord(purchaseId) {
      addLog('info', '测试 5: 验证购买记录...');
      addLog('info', `查询购买识别码: ${purchaseId}`);

      try {
        const result = await db.collection('ax_purchase_history')
          .where({ PURCHASE_ID: purchaseId })
          .get();

        if (result.data && result.data.length > 0) {
          const record = result.data[0];
          addLog('success', '购买记录验证成功!', JSON.stringify(record, null, 2));
          return true;
        }

        addLog('error', '未找到购买记录');
        return false;
      } catch (error) {
        addLog('error', '验证购买记录失败', error.message);
        return false;
      }
    }

    // 测试 6: 清理测试数据
    async function testCleanup(purchaseId) {
      addLog('info', '测试 6: 清理测试数据...');

      try {
        const result = await db.collection('ax_purchase_history')
          .where({ PURCHASE_ID: purchaseId })
          .remove();

        addLog('success', '测试数据清理成功', `删除 ${result.deleted || 0} 条记录`);
        return true;
      } catch (error) {
        addLog('warn', '清理测试数据失败 (可手动清理)', error.message);
        return false;
      }
    }

    // 运行所有测试
    async function runTests() {
      if (isRunning) return;
      isRunning = true;

      const btn = document.getElementById('runBtn');
      btn.disabled = true;
      btn.textContent = '测试中...';

      clearLogs();
      document.getElementById('logs').innerHTML = '';

      addLog('info', '========================================');
      addLog('info', '  卡项购买 API 测试开始');
      addLog('info', '  smartbeauty-web');
      addLog('info', '========================================');

      const results = {
        init: false,
        login: false,
        dbConnection: false,
        createOrder: false,
        verifyRecord: false,
        cleanup: null
      };

      let purchaseId = null;

      try {
        // 测试 1
        results.init = await testInit();
        if (!results.init) throw new Error('初始化失败');

        // 测试 2
        results.login = await testLogin();

        // 测试 3
        results.dbConnection = await testDbConnection();
        if (!results.dbConnection) throw new Error('数据库连接失败');

        // 测试 4
        const orderResult = await testCreateOrder();
        results.createOrder = orderResult.success;
        purchaseId = orderResult.purchaseId;
        if (!results.createOrder) throw new Error('创建订单失败');

        // 测试 5
        results.verifyRecord = await testVerifyRecord(purchaseId);

        // 测试 6
        results.cleanup = await testCleanup(purchaseId);

      } catch (error) {
        addLog('error', '测试过程中发生错误', error.message);
      }

      // 显示测试报告
      addLog('info', '========================================');
      addLog('info', '  测试报告');
      addLog('info', '========================================');

      const passCount = Object.values(results).filter(v => v === true).length;
      const totalCount = Object.keys(results).length;

      addLog('info', `测试结果: ${passCount}/${totalCount} 通过`);

      if (passCount >= 5) {
        addLog('success', '卡项购买 API 功能正常! createPurchaseOrder 可以正常工作。');
      } else {
        addLog('warn', '部分测试未通过，请检查错误信息。');
      }

      showResults(results);

      btn.disabled = false;
      btn.textContent = '运行测试';
      isRunning = false;
    }
  </script>
</body>
</html>
